<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sol</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
width: 100%;
height: 100%;
background: white;
font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight: 300;
color: #222;
}

.sol {
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
animation: swipeUp 0.8s ease-out;
}

.header {
padding: 50px 60px 20px;
}

.ring {
width: 80px;
height: 80px;
border: 7px solid #f4c400;
border-radius: 50%;
margin-bottom: 25px;
}

.welcome {
font-size: 32px;
line-height: 1.35;
min-height: 45px;
opacity: 1;
transform: translateY(0);
transition:
opacity 0.3s ease,
transform 0.3s ease;
}

.welcome.swipe {
opacity: 0;
transform: translateY(-25px);
}

.welcome.swipe-in {
opacity: 1;
transform: translateY(25px);
}

.conversation {
flex: 1;
overflow-y: auto;
padding: 20px 60px 140px;
}

.message {
max-width: 750px;
margin-bottom: 28px;
animation: messageUp 0.35s ease-out;
}

.sender {
font-size: 17px;
color: #777;
margin-bottom: 5px;
}

.messageText {
font-size: 25px;
line-height: 1.4;
}

.searchLink {
color: #b38c00;
text-decoration: underline;
cursor: pointer;
}

.searchLink:hover {
color: #806500;
}

.timerDisplay {
font-size: 30px;
margin-top: 8px;
}

.thinking {
font-size: 22px;
color: #777;
animation: thinkingPulse 1.2s infinite;
}

.inputArea {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
padding: 20px 60px 30px;
background: rgba(255,255,255,0.97);
}

.inputBox {
max-width: 900px;
display: flex;
align-items: center;
border-bottom: 1px solid #aaa;
}

input {
flex: 1;
border: none;
outline: none;
background: transparent;
font-family: inherit;
font-size: 21px;
font-weight: 300;
padding: 12px 0;
}

button {
border: none;
background: transparent;
font-family: inherit;
font-size: 18px;
cursor: pointer;
}

button:hover {
color: #b38c00;
}

@keyframes swipeUp {
from {
opacity: 0;
transform: translateY(70px);
}

to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes messageUp {
from {
opacity: 0;
transform: translateY(15px);
}

to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes thinkingPulse {
0%, 100% {
opacity: 0.45;
}

50% {
opacity: 1;
}
}

@media (max-width: 600px) {

.header {
padding: 30px 25px 10px;
}

.conversation {
padding-left: 25px;
padding-right: 25px;
}

.inputArea {
padding-left: 25px;
padding-right: 25px;
}

.ring {
width: 65px;
height: 65px;
}

.welcome {
font-size: 26px;
}

.messageText {
font-size: 22px;
}
}
</style>
</head>

<body>

<div class="sol">

<div class="header">

<div class="ring"></div>

<div id="welcome" class="welcome">
How can I help you?
</div>

</div>

<div id="conversation" class="conversation"></div>

<div class="inputArea">

<div class="inputBox">

<input
id="userInput"
type="text"
placeholder="Ask Sol..."
autocomplete="off"
>

<button onclick="askSol()">
Send
</button>

</div>

</div>

</div>


<script>

/* =========================================
WAITING TEXT
========================================= */

const waitingMessages = [
"How can I help you?",
"Go ahead, I’m listening.",
"You can type on the line below."
];

let waitingIndex = 0;

const welcome =
document.getElementById("welcome");

setInterval(() => {

welcome.classList.remove("swipe-in");
welcome.classList.add("swipe");

setTimeout(() => {

waitingIndex =
(waitingIndex + 1) %
waitingMessages.length;

welcome.textContent =
waitingMessages[waitingIndex];

welcome.classList.remove("swipe");

void welcome.offsetWidth;

welcome.classList.add("swipe-in");

}, 300);

}, 4000);


/* =========================================
USER MESSAGE
========================================= */

function addUserMessage(text) {

const conversation =
document.getElementById("conversation");

const message =
document.createElement("div");

message.className = "message";

message.innerHTML = `
<div class="sender">You</div>
<div class="messageText">
${escapeHTML(text)}
</div>
`;

conversation.appendChild(message);

scrollDown();
}


/* =========================================
SOL MESSAGE
========================================= */

function addSolMessage(text) {

const conversation =
document.getElementById("conversation");

const message =
document.createElement("div");

message.className = "message";

message.innerHTML = `
<div class="sender">Sol</div>
<div class="messageText">
${text}
</div>
`;

conversation.appendChild(message);

scrollDown();
}


/* =========================================
THINKING
========================================= */

function addThinking() {

const conversation =
document.getElementById("conversation");

const message =
document.createElement("div");

message.id = "thinkingMessage";
message.className = "message";

message.innerHTML = `
<div class="sender">Sol</div>
<div class="thinking">…</div>
`;

conversation.appendChild(message);

scrollDown();
}


function removeThinking() {

const thinking =
document.getElementById("thinkingMessage");

if (thinking) {
thinking.remove();
}
}


/* =========================================
TIMER
========================================= */

let timerInterval = null;
let timerEndTime = null;


function startTimer(minutes) {

if (timerInterval) {
clearInterval(timerInterval);
}

timerEndTime =
Date.now() + (minutes * 60 * 1000);

const conversation =
document.getElementById("conversation");

const message =
document.createElement("div");

message.className = "message";
message.id = "timerMessage";

message.innerHTML = `
<div class="sender">Sol</div>

<div class="messageText">
Timer set for ${minutes}
minute${minutes === 1 ? "" : "s"}.
</div>

<div id="timerDisplay"
class="timerDisplay">
${minutes}:00
</div>
`;

conversation.appendChild(message);

scrollDown();

updateTimer();

timerInterval =
setInterval(updateTimer, 250);
}


function updateTimer() {

const remaining =
Math.max(
0,
timerEndTime - Date.now()
);

const totalSeconds =
Math.ceil(remaining / 1000);

const minutes =
Math.floor(totalSeconds / 60);

const seconds =
totalSeconds % 60;

const display =
document.getElementById("timerDisplay");

if (display) {

display.textContent =
minutes +
":" +
String(seconds).padStart(2, "0");
}

if (remaining <= 0) {

clearInterval(timerInterval);

timerInterval = null;

if (display) {
display.textContent = "0:00";
}

addSolMessage(
"Your timer is done!"
);

if ("Notification" in window) {

if (
Notification.permission ===
"granted"
) {

new Notification("Sol", {
body:
"Your timer is done!"
});
}
}
}
}


function cancelTimer() {

if (timerInterval) {

clearInterval(timerInterval);

timerInterval = null;

timerEndTime = null;

const timer =
document.getElementById(
"timerMessage"
);

if (timer) {
timer.remove();
}

addSolMessage(
"Timer cancelled."
);

return true;
}

return false;
}


/* =========================================
RANDOM / FUN
========================================= */

function randomNumber() {

return Math.floor(
Math.random() * 100
) + 1;
}


/* =========================================
CALCULATOR
========================================= */

function calculateExpression(expression) {

try {

/*
Only allow numbers and basic
mathematical operators.
*/

if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {
return null;
}

const result =
Function(
'"use strict"; return (' +
expression.replace(
/%/g,
"/100"
) +
")"
)();

if (
typeof result !== "number" ||
!isFinite(result)
) {
return null;
}

return result;

} catch {
return null;
}
}


/* =========================================
SOL COMMANDS
========================================= */

function askSol() {

const input =
document.getElementById("userInput");

const text =
input.value.trim();

if (!text) return;

addUserMessage(text);

input.value = "";

const command =
text.toLowerCase().trim();

addThinking();

setTimeout(() => {

removeThinking();


/* ================================
GREETINGS
================================= */

if (
command === "hello" ||
command === "hi" ||
command === "hey" ||
command === "hiya" ||
command === "hey sol" ||
command === "hello sol"
) {

addSolMessage(
"How can I help you?"
);

return;
}


/* ================================
HOW ARE YOU
================================= */

if (
command.includes("how are you") ||
command.includes("how are u")
) {

addSolMessage(
"I’m doing great, thank you for asking!"
);

return;
}


/* ================================
NAME
================================= */

if (
command.includes("your name") ||
command === "who are you"
) {

addSolMessage(
"My name is Sol."
);

return;
}


/* ================================
WHAT CAN YOU DO
================================= */

if (
command.includes("what can you do") ||
command === "what do you do" ||
command === "what can i ask you"
) {

addSolMessage(
"I can answer simple questions, tell you the date and time, set 1–5 minute timers, perform simple calculations, and help you search the web."
);

return;
}


/* ================================
WHAT IS SOL
================================= */

if (
command === "what is sol" ||
command === "who is sol"
) {

addSolMessage(
"I’m Sol, your personal assistant."
);

return;
}


/* ================================
ABOUT SOL
================================= */

if (
command === "tell me about yourself" ||
command === "tell me about sol"
) {

addSolMessage(
"I’m Sol, a simple personal virtual assistant."
);

return;
}


/* ================================
WHO MADE YOU
================================= */

if (
command === "who made you" ||
command === "who created you"
) {

addSolMessage(
"I was created as Sol, a personal assistant."
);

return;
}


/* ================================
AI / REAL
================================= */

if (
command === "are you real" ||
command === "are you a real person"
) {

addSolMessage(
"I’m a virtual assistant, not a person."
);

return;
}


if (
command === "are you an ai" ||
command === "are you ai"
) {

addSolMessage(
"I’m a programmed virtual assistant. I don’t use AI to generate my responses."
);

return;
}


if (
command === "are you smart" ||
command === "are you intelligent"
) {

addSolMessage(
"I know what I’ve been programmed to know!"
);

return;
}


/* ================================
HELP / COMMANDS
================================= */

if (
command === "help" ||
command === "i need help" ||
command === "can you help" ||
command === "can you help me"
) {

addSolMessage(
"You can ask me about the date, time, Sol, timers, calculations, jokes, or ask me to show my commands."
);

return;
}


if (
command === "commands" ||
command === "list of commands" ||
command === "command list" ||
command === "show commands" ||
command === "show me the commands" ||
command === "list commands" ||
command === "tell me the commands"
) {

addSolMessage(`

<strong>Sol's commands</strong><br><br>

<strong>Assistant</strong><br>
Hello / Hi / Hey / Hey Sol<br>
How are you?<br>
Who are you?<br>
What is your name?<br>
What can you do?<br>
What is Sol?<br>
Tell me about yourself<br>
Who made you?<br>
Are you real?<br>
Are you an AI?<br>
Are you smart?<br>
Help<br><br>

<strong>Date & Time</strong><br>
What's the date?<br>
What day is it?<br>
What month is it?<br>
What year is it?<br>
What time is it?<br>
Time<br><br>

<strong>Timers</strong><br>
Set a timer for 1 minute<br>
Set a timer for 2 minutes<br>
Set a timer for 3 minutes<br>
Set a timer for 4 minutes<br>
Set a timer for 5 minutes<br>
Stop / Cancel<br><br>

<strong>Fun</strong><br>
Tell me a joke<br>
Another joke<br>
Tell me a fact<br>
Surprise me<br>
Flip a coin<br>
Heads or tails<br>
Roll a die<br>
Pick a number<br>
Random number<br>
Say something<br>
Make me laugh<br>
Entertain me<br><br>

<strong>Math</strong><br>
Calculate 5 + 5<br>
What is 10 minus 5?<br>
What is 5 times 5?<br>
What is 10 divided by 2?<br><br>

<strong>Other</strong><br>
Good morning<br>
Good afternoon<br>
Good evening<br>
Good night<br>
Goodbye / Bye<br>
Thanks / Thank you<br>
Version

`);

return;
}


/* ================================
DATE
================================= */

if (
command.includes("what's the date") ||
command.includes("what is the date") ||
command === "date" ||
command.includes("what day is it") ||
command.includes("what day is today") ||
command === "today"
) {

const today =
new Date();

const date =
today.toLocaleDateString(
undefined,
{
weekday: "long",
month: "long",
day: "numeric",
year: "numeric"
}
);

addSolMessage(
"Today is " + date + "."
);

return;
}


/* ================================
MONTH
================================= */

if (
command === "what month is it" ||
command === "what month is this"
) {

const month =
new Date().toLocaleDateString(
undefined,
{
month: "long"
}
);

addSolMessage(
"It’s " + month + "."
);

return;
}


/* ================================
YEAR
================================= */

if (
command === "what year is it" ||
command === "what year is this"
) {

addSolMessage(
"It’s " +
new Date().getFullYear() +
"."
);

return;
}


/* ================================
TIME
================================= */

if (
command.includes("what time is it") ||
command === "time" ||
command.includes("what's the time") ||
command.includes("what is the time")
) {

const now =
new Date();

const time =
now.toLocaleTimeString(
undefined,
{
hour: "numeric",
minute: "2-digit"
}
);

addSolMessage(
"It’s " + time + "."
);

return;
}


/* ================================
TIMER
================================= */

const timerMatch =
command.match(
/(?:set\s+(?:a\s+)?)?timer\s+(?:for\s+)?(\d+)\s*(minute|minutes|min|mins)/
);

if (timerMatch) {

const minutes =
parseInt(timerMatch[1]);

if (
minutes >= 1 &&
minutes <= 5
) {

startTimer(minutes);

return;

} else {

addSolMessage(
"I can only set timers from 1 to 5 minutes."
);

return;
}
}


/* ================================
CANCEL TIMER
================================= */

if (
command === "stop" ||
command === "cancel" ||
command === "cancel timer" ||
command === "stop timer" ||
command === "never mind"
) {

if (!cancelTimer()) {

addSolMessage(
"There isn't an active timer."
);
}

return;
}


/* ================================
GOOD MORNING
================================= */

if (
command.includes("good morning")
) {

addSolMessage(
"Good morning! ☀️"
);

return;
}


/* ================================
GOOD AFTERNOON
================================= */

if (
command.includes("good afternoon")
) {

addSolMessage(
"Good afternoon!"
);

return;
}


/* ================================
GOOD EVENING
================================= */

if (
command.includes("good evening")
) {

addSolMessage(
"Good evening!"
);

return;
}


/* ================================
GOOD NIGHT
================================= */

if (
command === "good night" ||
command === "goodnight"
) {

addSolMessage(
"Good night!"
);

return;
}


/* ================================
GOODBYE
================================= */

if (
command === "bye" ||
command === "goodbye"
) {

addSolMessage(
"Goodbye! ☀️"
);

return;
}


/* ================================
THANK YOU
================================= */

if (
command === "thanks" ||
command === "thank you" ||
command.includes("thanks sol")
) {

addSolMessage(
"You’re welcome!"
);

return;
}


/* ================================
YOU'RE WELCOME
================================= */

if (
command === "you're welcome" ||
command === "you are welcome"
) {

addSolMessage(
"Thank you!"
);

return;
}


/* ================================
JOKES
================================= */

if (
command.includes("tell me a joke") ||
command === "joke" ||
command === "make me laugh"
) {

const jokes = [
"Why did the computer go to the doctor? Because it had a virus! 😄",
"Why was the computer cold? It left its Windows open! 😄",
"Why did the computer get glasses? It wanted to improve its web sight! 😄"
];

addSolMessage(
jokes[
Math.floor(
Math.random() *
jokes.length
)
]
);

return;
}


/* ================================
ANOTHER JOKE
================================= */

if (
command === "another joke"
) {

addSolMessage(
"Why did the computer get glasses? It wanted to improve its web sight! 😄"
);

return;
}


/* ================================
FACT
================================= */

if (
command === "tell me a fact" ||
command === "fact"
) {

addSolMessage(
"A day on Venus is longer than a year on Venus."
);

return;
}


/* ================================
SURPRISE
================================= */

if (
command === "surprise me"
) {

addSolMessage(
"Here’s a surprise: octopuses have three hearts! 🐙"
);

return;
}


/* ================================
COIN FLIP
================================= */

if (
command === "flip a coin" ||
command === "heads or tails"
) {

const result =
Math.random() < 0.5
? "Heads!"
: "Tails!";

addSolMessage(result);

return;
}


/* ================================
DIE
================================= */

if (
command === "roll a die" ||
command === "roll the dice"
) {

const result =
Math.floor(
Math.random() * 6
) + 1;

addSolMessage(
"You rolled a " +
result +
"."
);

return;
}


/* ================================
RANDOM NUMBER
================================= */

if (
command === "pick a number" ||
command === "random number"
) {

addSolMessage(
"How about " +
randomNumber() +
"?"
);

return;
}


/* ================================
SAY SOMETHING
================================= */

if (
command === "say something" ||
command === "tell me something"
) {

addSolMessage(
"Hello from Sol! ☀️"
);

return;
}


/* ================================
ENTERTAIN
================================= */

if (
command === "entertain me"
) {

addSolMessage(
"Here I am! ☀️ What would you like to ask?"
);

return;
}


/* ================================
SOL PERSONALITY
================================= */

if (
command === "do you like me"
) {

addSolMessage(
"Of course! ☀️"
);

return;
}


if (
command === "are you my assistant"
) {

addSolMessage(
"Yes. I’m Sol, your personal assistant."
);

return;
}


if (
command === "are you listening" ||
command === "can you hear me"
) {

addSolMessage(
"I’m listening."
);

return;
}


if (
command === "wake up" ||
command === "hey there"
) {

addSolMessage(
"I’m here. How can I help you?"
);

return;
}


if (
command === "nice to meet you"
) {

addSolMessage(
"Nice to meet you too!"
);

return;
}


/* ================================
FAVORITE COLOR
================================= */

if (
command === "what is your favorite color" ||
command === "do you have a favorite color"
) {

addSolMessage(
"Yellow. ☀️"
);

return;
}


/* ================================
CALCULATOR
================================= */

let mathExpression = null;

const calculateMatch =
command.match(
/^calculate\s+(.+)$/
);

if (calculateMatch) {
mathExpression =
calculateMatch[1];
}


if (!mathExpression) {

const whatIsMatch =
command.match(
/^what is\s+(.+)$/
);

if (
whatIsMatch &&
/[0-9]/.test(
whatIsMatch[1]
)
) {
mathExpression =
whatIsMatch[1]
.replace(
/plus/g,
"+"
)
.replace(
/minus/g,
"-"
)
.replace(
/times/g,
"*"
)
.replace(
/multiplied by/g,
"*"
)
.replace(
/divided by/g,
"/"
);
}
}


if (mathExpression) {

const result =
calculateExpression(
mathExpression
);

if (result !== null) {

addSolMessage(
"The answer is " +
result +
"."
);

return;
}
}


/* ================================
VERSION
================================= */

if (
command === "version" ||
command === "sol version" ||
command === "what is your version"
) {

addSolMessage(
"Sol | Version 3.0 Special Edition | Made in New York | Sol ™"
);

return;
}


/* ================================
UNKNOWN COMMAND / WEB
================================= */

const encodedQuery =
encodeURIComponent(text);

addSolMessage(
"I’m not sure how to help with that, " +
'<a class="searchLink" href="https://www.google.com/search?q=' +
encodedQuery +
'" target="_blank">' +
"click here to search the web" +
"</a>."
);

}, 900);
}


/* =========================================
ENTER KEY
========================================= */

document
.getElementById("userInput")
.addEventListener(
"keydown",
function(event) {

if (event.key === "Enter") {
askSol();
}

}
);


/* =========================================
HELPERS
========================================= */

function scrollDown() {

const conversation =
document.getElementById(
"conversation"
);

conversation.scrollTop =
conversation.scrollHeight;
}


function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;
}

</script>

</body>
</html>
